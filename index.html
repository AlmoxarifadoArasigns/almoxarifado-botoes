<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arasigns - Almoxarifado</title>

<style>

:root{
    --bg:#08090b;
    --card:#111214;
    --card2:#17181b;
    --line:#303136;

    --white:#f7f7f7;
    --muted:#a9aaae;

    --red:#ff1726;
    --orange:#ff6a00;
    --yellow:#ffd000;

    --green:#16d46b;
}

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--white);
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
}

.app{
    width:min(1000px,100%);
    margin:auto;
    padding:18px;
}

/* =========================
   HEADER
========================= */

.header{
    text-align:center;
    padding:5px 0 18px;
}

.logo{
    width:min(500px,90%);
    max-height:120px;
    object-fit:contain;
    display:block;
    margin:auto;

    filter:
        drop-shadow(
            0 4px 18px rgba(0,0,0,.45)
        );
}

.subtitle{
    margin-top:8px;

    font-size:
        clamp(
            15px,
            2.5vw,
            23px
        );

    letter-spacing:4px;
    font-weight:900;
    color:#ddd;
}

.brand-line{
    width:90%;
    height:3px;

    margin:15px auto;

    border-radius:20px;

    background:
        linear-gradient(
            90deg,
            var(--red),
            var(--orange),
            var(--yellow)
        );
}

/* =========================
   CARDS
========================= */

.card{
    background:
        linear-gradient(
            145deg,
            var(--card),
            #0d0e10
        );

    border:
        1px solid
        var(--line);

    border-radius:24px;

    padding:20px;

    margin-top:16px;
}

.section-title{
    font-size:22px;
    font-weight:900;

    margin-bottom:16px;
}

.section-subtitle{
    color:var(--muted);
    font-size:14px;
    margin-top:-10px;
    margin-bottom:18px;
}

/* =========================
   ETAPAS
========================= */

.step{
    display:none;
}

.step.active{
    display:block;
}

/* =========================
   FUNCIONÁRIOS
========================= */

.employee-grid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:12px;
}

.employee-btn{

    min-height:75px;

    border:1px solid #35363a;

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            #18191c,
            #111214
        );

    color:white;

    cursor:pointer;

    font-size:18px;
    font-weight:900;

    text-align:left;

    padding:16px;

    transition:.15s;
}

.employee-btn:hover{
    border-color:var(--orange);

    transform:translateY(-2px);
}

.employee-btn:active{
    transform:scale(.97);
}

.employee-number{
    color:var(--orange);
    font-size:13px;

    display:block;
    margin-bottom:5px;
}

/* =========================
   CATEGORIAS
========================= */

.category-grid{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:12px;
}

.category-btn{

    min-height:100px;

    border:1px solid #35363a;

    border-radius:20px;

    background:#151619;

    color:white;

    cursor:pointer;

    font-size:19px;

    font-weight:900;

    transition:.15s;
}

.category-btn:hover{

    border-color:var(--orange);

    transform:translateY(-2px);
}

.category-icon{

    display:block;

    font-size:35px;

    margin-bottom:7px;
}

/* =========================
   ITENS
========================= */

.search-box{

    width:100%;

    padding:16px;

    margin-bottom:15px;

    border-radius:16px;

    border:1px solid #35363a;

    background:#0c0d0f;

    color:white;

    font-size:17px;

    outline:none;
}

.search-box:focus{

    border-color:
        var(--orange);
}

.item-grid{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:12px;
}

.item-btn{

    min-height:80px;

    padding:15px;

    border-radius:18px;

    border:1px solid #35363a;

    background:#151619;

    color:white;

    cursor:pointer;

    text-align:left;

    font-size:17px;

    font-weight:900;

    transition:.15s;
}

.item-btn:hover{

    border-color:
        var(--yellow);

    transform:translateY(-2px);
}

.item-code{

    display:block;

    color:var(--muted);

    font-size:12px;

    margin-top:6px;
}

/* =========================
   SELECIONADO
========================= */

.selected{

    border:
        2px solid
        var(--orange);

    background:
        linear-gradient(
            145deg,
            #24150e,
            #17181b
        );
}

.selected-box{

    padding:18px;

    border-radius:18px;

    background:#0d0e10;

    border:1px solid #303136;

    margin-bottom:18px;
}

.selected-label{

    color:var(--orange);

    font-size:13px;

    font-weight:900;

    margin-bottom:6px;
}

.selected-name{

    font-size:25px;

    font-weight:900;
}

/* =========================
   ENTRADA / SAÍDA
========================= */

.movement-grid{

    display:grid;

    grid-template-columns:
        1fr
        1fr;

    gap:15px;
}

.movement-btn{

    min-height:120px;

    border:0;

    border-radius:22px;

    color:white;

    cursor:pointer;

    font-size:23px;

    font-weight:900;

    transition:.15s;
}

.movement-btn:active{

    transform:scale(.97);
}

.exit{

    background:
        linear-gradient(
            135deg,
            var(--red),
            var(--orange)
        );

    box-shadow:
        0 10px 30px
        rgba(255,23,38,.18);
}

.entry{

    background:
        linear-gradient(
            135deg,
            #0c9f50,
            var(--green)
        );

    box-shadow:
        0 10px 30px
        rgba(22,212,107,.15);
}

.movement-icon{

    display:block;

    font-size:42px;

    margin-bottom:7px;
}

/* =========================
   NAVEGAÇÃO
========================= */

.nav-buttons{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:12px;

    margin-top:15px;
}

.nav-btn{

    padding:15px;

    border-radius:16px;

    background:#242529;

    border:1px solid #35363a;

    color:white;

    font-weight:900;

    cursor:pointer;
}

.nav-btn.cancel{

    background:#17181b;
}

/* =========================
   HISTÓRICO
========================= */

.history-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:10px;

    margin-bottom:15px;
}

.count{

    color:var(--yellow);

    font-weight:900;
}

.history{

    display:flex;

    flex-direction:column;

    gap:9px;
}

.movement-record{

    display:grid;

    grid-template-columns:
        1fr
        1fr
        auto;

    gap:12px;

    align-items:center;

    padding:14px;

    border-radius:15px;

    background:#151619;

    border:1px solid #2d2e32;
}

.record-small{

    display:block;

    color:#888;

    font-size:11px;

    margin-bottom:4px;
}

.record-value{

    font-weight:900;
}

.record-type{

    font-weight:900;

    color:var(--yellow);

    text-align:right;
}

.empty{

    padding:30px;

    text-align:center;

    border-radius:18px;

    background:#0d0e10;

    border:1px solid #292a2d;

    color:var(--muted);
}

/* =========================
   CSV
========================= */

.csv-btn{

    width:100%;

    margin-top:15px;

    padding:17px;

    border:0;

    border-radius:18px;

    background:
        linear-gradient(
            90deg,
            var(--red),
            var(--orange),
            var(--yellow)
        );

    color:white;

    font-size:18px;

    font-weight:900;

    cursor:pointer;
}

/* =========================
   TOAST
========================= */

.toast{

    position:fixed;

    left:50%;
    bottom:25px;

    transform:
        translate(-50%,120px);

    opacity:0;

    z-index:999;

    background:#17181b;

    border:1px solid #404146;

    border-radius:15px;

    padding:14px 20px;

    font-weight:900;

    box-shadow:
        0 15px 35px
        rgba(0,0,0,.5);

    transition:.25s;

    max-width:90%;

    text-align:center;
}

.toast.show{

    transform:
        translate(-50%,0);

    opacity:1;
}

/* =========================
   DESKTOP
========================= */

@media(min-width:701px){

    .employee-grid{

        grid-template-columns:
            repeat(4,1fr);
    }

    .category-grid{

        grid-template-columns:
            repeat(3,1fr);
    }

    .item-grid{

        grid-template-columns:
            repeat(3,1fr);
    }

}

/* =========================
   CELULAR
========================= */

@media(max-width:700px){

    .app{

        padding:
            10px
            10px
            30px;
    }

    .logo{

        width:94%;

        max-height:100px;
    }

    .subtitle{

        font-size:13px;

        letter-spacing:3px;
    }

    .card{

        padding:14px;

        border-radius:20px;
    }

    .employee-btn{

        min-height:68px;

        font-size:16px;

        padding:13px;
    }

    .category-btn{

        min-height:90px;

        font-size:16px;
    }

    .category-icon{

        font-size:30px;
    }

    .item-btn{

        font-size:15px;

        min-height:70px;
    }

    .movement-btn{

        min-height:105px;

        font-size:18px;
    }

    .movement-icon{

        font-size:35px;
    }

    .movement-record{

        grid-template-columns:
            1fr
            1fr;
    }

    .record-type{

        text-align:left;

        grid-column:
            1 / -1;
    }

}

/* =========================
   TELA GRANDE
========================= */

.screen-title{

    text-align:center;

    margin-bottom:20px;
}

.screen-title h1{

    margin:0;

    font-size:
        clamp(
            24px,
            5vw,
            38px
        );
}

.screen-title p{

    color:var(--muted);

    margin-top:7px;
}

</style>

</head>

<body>

<div class="app">

<!-- =========================================
     CABEÇALHO
========================================= -->

<header class="header">

    <img
        src="Logo.png"
        class="logo"
        alt="Arasigns"
    >

    <div class="subtitle">
        CONTROLE DE ALMOXARIFADO
    </div>

    <div class="brand-line"></div>

</header>


<!-- =========================================
     PASSO 1 - FUNCIONÁRIO
========================================= -->

<section
    class="card step active"
    id="stepEmployee"
>

    <div class="screen-title">

        <h1>
            👷 QUEM ESTÁ RETIRANDO?
        </h1>

        <p>
            Toque no nome do funcionário
        </p>

    </div>

    <div
        class="employee-grid"
        id="employeeGrid"
    ></div>

</section>


<!-- =========================================
     PASSO 2 - CATEGORIA
========================================= -->

<section
    class="card step"
    id="stepCategory"
>

    <div class="screen-title">

        <h1>
            📦 ESCOLHA UMA CATEGORIA
        </h1>

        <p id="selectedEmployeeText"></p>

    </div>

    <div class="category-grid">

        <button
            class="category-btn"
            onclick="selectCategory('FERRAMENTAS')"
        >

            <span class="category-icon">
                🔧
            </span>

            FERRAMENTAS

        </button>


        <button
            class="category-btn"
            onclick="selectCategory('ELETRICA')"
        >

            <span class="category-icon">
                💡
            </span>

            ELÉTRICA / LED

        </button>


        <button
            class="category-btn"
            onclick="selectCategory('CHAPAS')"
        >

            <span class="category-icon">
                📐
            </span>

            CHAPAS

        </button>


        <button
            class="category-btn"
            onclick="selectCategory('COLAS')"
        >

            <span class="category-icon">
                🧴
            </span>

            COLAS / ADESIVOS

        </button>


        <button
            class="category-btn"
            onclick="selectCategory('CONSUMIVEIS')"
        >

            <span class="category-icon">
                🛠️
            </span>

            CONSUMÍVEIS

        </button>


        <button
            class="category-btn"
            onclick="selectCategory('EPI')"
        >

            <span class="category-icon">
                🦺
            </span>

            EPI

        </button>

    </div>

    <div class="nav-buttons">

        <button
            class="nav-btn cancel"
            onclick="resetWorkflow()"
        >
            ❌ CANCELAR
        </button>

    </div>

</section>


<!-- =========================================
     PASSO 3 - ITEM
========================================= -->

<section
    class="card step"
    id="stepItem"
>

    <div class="screen-title">

        <h1>
            📦 ESCOLHA O ITEM
        </h1>

        <p id="categoryTitle"></p>

    </div>


    <input
        type="text"
        id="searchItem"
        class="search-box"
        placeholder="🔎 Pesquisar material ou ferramenta..."
        oninput="filterItems()"
    >


    <div
        class="item-grid"
        id="itemGrid"
    ></div>


    <div class="nav-buttons">

        <button
            class="nav-btn"
            onclick="backToCategories()"
        >
            ← VOLTAR
        </button>

        <button
            class="nav-btn cancel"
            onclick="resetWorkflow()"
        >
            ❌ CANCELAR
        </button>

    </div>

</section>


<!-- =========================================
     PASSO 4 - MOVIMENTAÇÃO
========================================= -->

<section
    class="card step"
    id="stepMovement"
>

    <div class="screen-title">

        <h1>
            🔄 MOVIMENTAÇÃO
        </h1>

        <p>
            Confirme o que deseja fazer
        </p>

    </div>


    <div class="selected-box">

        <div class="selected-label">
            FUNCIONÁRIO
        </div>

        <div
            class="selected-name"
            id="selectedEmployee"
        >
            —
        </div>

        <br>

        <div class="selected-label">
            ITEM
        </div>

        <div
            class="selected-name"
            id="selectedItem"
        >
            —
        </div>

    </div>


    <div class="movement-grid">

        <button
            class="movement-btn exit"
            onclick="finishMovement('SAÍDA')"
        >

            <span class="movement-icon">
                ⬆️
            </span>

            SAÍDA

        </button>


        <button
            class="movement-btn entry"
            onclick="finishMovement('ENTRADA')"
        >

            <span class="movement-icon">
                ⬇️
            </span>

            ENTRADA

        </button>

    </div>


    <div class="nav-buttons">

        <button
            class="nav-btn"
            onclick="backToItems()"
        >
            ← VOLTAR
        </button>

        <button
            class="nav-btn cancel"
            onclick="resetWorkflow()"
        >
            ❌ CANCELAR
        </button>

    </div>

</section>


<!-- =========================================
     HISTÓRICO
========================================= -->

<section class="card">

    <div class="history-header">

        <div class="section-title">
            📋 ÚLTIMAS MOVIMENTAÇÕES
        </div>

        <div
            class="count"
            id="count"
        >
            0 REGISTROS
        </div>

    </div>


    <div
        class="history"
        id="history"
    >

        <div class="empty">

            Nenhuma movimentação registrada.

        </div>

    </div>


    <button
        class="csv-btn"
        onclick="exportCSV()"
    >
        📄 GERAR CSV
    </button>

</section>


</div>


<!-- =========================================
     TOAST
========================================= -->

<div
    class="toast"
    id="toast"
></div>


<script>

/* =========================================
   FUNCIONÁRIOS
========================================= */

const FUNCIONARIOS = [

    {
        codigo:"001",
        nome:"TOCO"
    },

    {
        codigo:"002",
        nome:"RAMALHO"
    },

    {
        codigo:"003",
        nome:"LUAN"
    },

    {
        codigo:"004",

    },

    {
        codigo:"005",
        nome:"DIEGO"
    },

    {
        codigo:"006",
        nome:"WELTON"
    },

    {
        codigo:"007",
        nome:"GILDO"
    },

    {
        codigo:"008",
        nome:"WESLEY"
    },

    {
        codigo:"009",
        nome:"DENIS"
    },

    {
        codigo:"010",
        nome:"ISA"
    },

    {
        codigo:"011",
        nome:"JULIA"
    },

    {
        codigo:"012",
        nome:"MARI"
    },

    {
        codigo:"013",
        nome:"CAMINHÃO"
    },

    {
        codigo:"014",
        nome:"SAVEIRO"
    }

];


/* =========================================
   ITENS
========================================= */

const ITENS = {

    FERRAMENTAS:[

        {
            codigo:"F001",
            nome:"PARAFUSADEIRA"
        },

        {
            codigo:"F002",
            nome:"FURADEIRA"
        },

        {
            codigo:"F003",
            nome:"LIXADEIRA"
        },

        {
            codigo:"F004",
            nome:"MAQUITA"
        },

        {
            codigo:"F005",
            nome:"ESTILETE"
        },

        {
            codigo:"F006",
            nome:"ALICATE"
        },

        {
            codigo:"F007",
            nome:"CHAVE DE FENDA"
        }

    ],


    ELETRICA:[

        {
            codigo:"E001",
            nome:"FITA LED"
        },

        {
            codigo:"E002",
            nome:"MÓDULO LED"
        },

        {
            codigo:"E003",
            nome:"FONTE LED"
        },

        {
            codigo:"E004",
            nome:"CABO"
        },

        {
            codigo:"E005",
            nome:"CONECTOR"
        }

    ],


    CHAPAS:[

        {
            codigo:"C001",
            nome:"ACM"
        },

        {
            codigo:"C002",
            nome:"PVC"
        },

        {
            codigo:"C003",
            nome:"MDF"
        },

        {
            codigo:"C004",
            nome:"LONA"
        }

    ],


    COLAS:[

        {
            codigo:"CO001",
            nome:"ATIVADOR DE COLA",
            barcode:"7898674412716"
        },

        {
            codigo:"CO002",
            nome:"COLA INSTANTÂNEA"
        },

        {
            codigo:"CO003",
            nome:"FITA DUPLA FACE"
        },

        {
            codigo:"CO004",
            nome:"SILICONE"
        }

    ],


    CONSUMIVEIS:[

        {
            codigo:"CS001",
            nome:"DISCO DE CORTE"
        },

        {
            codigo:"CS002",
            nome:"LIXA"
        },

        {
            codigo:"CS003",
            nome:"FITA CREPE"
        },

        {
            codigo:"CS004",
            nome:"PARAFUSO"
        }

    ],


    EPI:[

        {
            codigo:"EP001",
            nome:"LUVA"
        },

        {
            codigo:"EP002",
            nome:"ÓCULOS DE PROTEÇÃO"
        },

        {
            codigo:"EP003",
            nome:"MÁSCARA"
        },

        {
            codigo:"EP004",
            nome:"PROTETOR AURICULAR"
        }

    ]

};


/* =========================================
   CONFIGURAÇÃO
========================================= */

const STORAGE_KEY =
    "arasigns_almoxarifado_botoes_v1";


let records =
    JSON.parse(
        localStorage.getItem(STORAGE_KEY)
        || "[]"
    );


let selectedEmployee = null;

let selectedCategory = null;

let selectedItem = null;


/* =========================================
   ELEMENTOS
========================================= */

const employeeGrid =
    document.getElementById(
        "employeeGrid"
    );

const itemGrid =
    document.getElementById(
        "itemGrid"
    );

const historyEl =
    document.getElementById(
        "history"
    );


/* =========================================
   FUNCIONÁRIOS
========================================= */

function renderEmployees(){

    employeeGrid.innerHTML =
        FUNCIONARIOS
        .map(
            funcionario => `

                <button
                    class="employee-btn"
                    onclick="selectEmployee('${funcionario.codigo}')"
                >

                    <span class="employee-number">
                        ${funcionario.codigo}
                    </span>

                    ${funcionario.nome}

                </button>

            `
        )
        .join("");

}


/* =========================================
   SELECIONAR FUNCIONÁRIO
========================================= */

function selectEmployee(codigo){

    selectedEmployee =
        FUNCIONARIOS.find(
            funcionario =>
                funcionario.codigo === codigo
        );

    if(!selectedEmployee)
        return;


    document.getElementById(
        "selectedEmployeeText"
    ).textContent =
        "Funcionário: " +
        selectedEmployee.nome;


    showStep("stepCategory");


    toast(
        "Funcionário selecionado: " +
        selectedEmployee.nome
    );

}


/* =========================================
   CATEGORIA
========================================= */

function selectCategory(category){

    selectedCategory =
        category;


    const nomes = {

        FERRAMENTAS:
            "🔧 FERRAMENTAS",

        ELETRICA:
            "💡 ELÉTRICA / LED",

        CHAPAS:
            "📐 CHAPAS",

        COLAS:
            "🧴 COLAS / ADESIVOS",

        CONSUMIVEIS:
            "🛠️ CONSUMÍVEIS",

        EPI:
            "🦺 EPI"

    };


    document.getElementById(
        "categoryTitle"
    ).textContent =
        nomes[category];


    document.getElementById(
        "searchItem"
    ).value = "";


    renderItems();


    showStep("stepItem");

}


/* =========================================
   MOSTRAR ITENS
========================================= */

function renderItems(){

    const lista =
        ITENS[selectedCategory]
        || [];


    itemGrid.innerHTML =

        lista
        .map(
            item => `

                <button
                    class="item-btn"
                    onclick="selectItem('${item.codigo}')"
                >

                    ${item.nome}

                    <span class="item-code">
                        Código interno:
                        ${item.codigo}
                    </span>

                </button>

            `
        )
        .join("");


    if(!lista.length){

        itemGrid.innerHTML = `

            <div class="empty">

                Nenhum item cadastrado
                nesta categoria.

            </div>

        `;

    }

}


/* =========================================
   PESQUISA
========================================= */

function filterItems(){

    const busca =
        document
        .getElementById(
            "searchItem"
        )
        .value
        .toLowerCase()
        .trim();


    const lista =
        ITENS[selectedCategory]
        || [];


    const filtrados =
        lista.filter(
            item =>
                item.nome
                    .toLowerCase()
                    .includes(busca)
                ||
                item.codigo
                    .toLowerCase()
                    .includes(busca)
        );


    itemGrid.innerHTML =

        filtrados
        .map(
            item => `

                <button
                    class="item-btn"
                    onclick="selectItem('${item.codigo}')"
                >

                    ${item.nome}

                    <span class="item-code">
                        Código interno:
                        ${item.codigo}
                    </span>

                </button>

            `
        )
        .join("");

}


/* =========================================
   SELECIONAR ITEM
========================================= */

function selectItem(codigo){

    const lista =
        ITENS[selectedCategory]
        || [];


    selectedItem =
        lista.find(
            item =>
                item.codigo === codigo
        );


    if(!selectedItem)
        return;


    document.getElementById(
        "selectedEmployee"
    ).textContent =
        selectedEmployee.nome;


    document.getElementById(
        "selectedItem"
    ).textContent =
        selectedItem.nome;


    showStep("stepMovement");


    toast(
        "Item selecionado: " +
        selectedItem.nome
    );

}


/* =========================================
   FINALIZAR
========================================= */

function finishMovement(tipo){

    if(
        !selectedEmployee ||
        !selectedItem
    ){

        toast(
            "Selecione funcionário e item."
        );

        return;

    }


    const dataHora =
        new Date()
        .toLocaleString(
            "pt-BR"
        );


    records.push({

        dataHora:
            dataHora,

        funcionario:
            selectedEmployee.nome,

        codigoFuncionario:
            selectedEmployee.codigo,

        item:
            selectedItem.nome,

        codigoItem:
            selectedItem.codigo,

        movimento:
            tipo

    });


    saveRecords();


    toast(
        "✅ " +
        tipo +
        " registrada!"
    );


    resetWorkflow();

}


/* =========================================
   SALVAR
========================================= */

function saveRecords(){

    localStorage.setItem(

        STORAGE_KEY,

        JSON.stringify(records)

    );


    renderHistory();

}


/* =========================================
   HISTÓRICO
========================================= */

function renderHistory(){

    const count =
        document.getElementById(
            "count"
        );


    count.textContent =
        records.length +
        (
            records.length === 1
                ? " REGISTRO"
                : " REGISTROS"
        );


    if(!records.length){

        historyEl.innerHTML = `

            <div class="empty">

                📋

                <br><br>

                Nenhuma movimentação registrada.

            </div>

        `;

        return;

    }


    historyEl.innerHTML =

        records
        .slice()
        .reverse()
        .slice(0,30)
        .map(
            registro => `

                <div class="movement-record">

                    <div>

                        <span class="record-small">
                            FUNCIONÁRIO
                        </span>

                        <span class="record-value">
                            ${escapeHtml(
                                registro.funcionario
                            )}
                        </span>

                    </div>


                    <div>

                        <span class="record-small">
                            ITEM
                        </span>

                        <span class="record-value">
                            ${escapeHtml(
                                registro.item
                            )}
                        </span>

                    </div>


                    <div class="record-type">

                        ${escapeHtml(
                            registro.movimento
                        )}

                        <br>

                        <span class="record-small">
                            ${escapeHtml(
                                registro.dataHora
                            )}
                        </span>

                    </div>

                </div>

            `
        )
        .join("");

}


/* =========================================
   SEGURANÇA
========================================= */

function escapeHtml(value){

    return String(
        value ?? ""
    )

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );

}


/* =========================================
   NAVEGAÇÃO
========================================= */

function showStep(id){

    document
        .querySelectorAll(".step")
        .forEach(
            step =>
                step.classList.remove(
                    "active"
                )
        );


    document
        .getElementById(id)
        .classList.add(
            "active"
        );


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================================
   VOLTAR CATEGORIAS
========================================= */

function backToCategories(){

    showStep(
        "stepCategory"
    );

}


/* =========================================
   VOLTAR ITENS
========================================= */

function backToItems(){

    renderItems();

    showStep(
        "stepItem"
    );

}


/* =========================================
   RESET
========================================= */

function resetWorkflow(){

    selectedEmployee = null;

    selectedCategory = null;

    selectedItem = null;


    document.getElementById(
        "selectedEmployeeText"
    ).textContent = "";


    showStep(
        "stepEmployee"
    );

}


/* =========================================
   CSV
========================================= */

function exportCSV(){

    if(!records.length){

        toast(
            "Ainda não existem movimentações."
        );

        return;

    }


    const headers = [

        "DATA/HORA",

        "FUNCIONÁRIO",

        "CÓD. FUNC.",

        "ITEM",

        "CÓD. ITEM",

        "MOVIMENTO"

    ];


    const rows =
        records.map(
            registro => [

                registro.dataHora,

                registro.funcionario,

                registro.codigoFuncionario,

                registro.item,

                registro.codigoItem,

                registro.movimento

            ]
        );


    const csv =

        "\uFEFF" +

        [

            headers,

            ...rows

        ]

        .map(

            row =>

                row
                .map(
                    value =>
                        `"${String(
                            value ?? ""
                        ).replaceAll(
                            '"',
                            '""'
                        )}"`
                )
                .join(";")

        )

        .join("\r\n");


    const blob =
        new Blob(
            [csv],
            {
                type:
                    "text/csv;charset=utf-8;"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    const date =
        new Date()
        .toISOString()
        .slice(0,10);


    a.href =
        url;


    a.download =
        "arasigns_almoxarifado_" +
        date +
        ".csv";


    document.body.appendChild(a);


    a.click();


    a.remove();


    URL.revokeObjectURL(
        url
    );


    toast(
        "📄 CSV gerado com sucesso!"
    );

}


/* =========================================
   TOAST
========================================= */

function toast(message){

    const el =
        document.getElementById(
            "toast"
        );


    el.textContent =
        message;


    el.classList.add(
        "show"
    );


    clearTimeout(
        window.toastTimer
    );


    window.toastTimer =
        setTimeout(
            () => {

                el.classList.remove(
                    "show"
                );

            },
            2500
        );

}


/* =========================================
   INICIAR
========================================= */

renderEmployees();

renderHistory();

</script>
